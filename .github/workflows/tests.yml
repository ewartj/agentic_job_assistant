name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs uv; Python comes from .python-version, dependencies are cached.
      - uses: astral-sh/setup-uv@v10.3.3

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # Tests run against tests/fixtures (see tests/conftest.py) - data/ is never in the repo.
      - name: Run tests
        run: uv run pytest -v

  # Separate job so a lint failure doesn't hide test results (and both run in parallel).
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      # Rules are configured in pyproject.toml [tool.ruff.lint].
      # github format annotates the offending lines in the PR diff.
      - name: Lint
        run: uv run ruff check --output-format=github .
      # Which package may import which: contracts in pyproject.toml [tool.importlinter].
      - name: Import contracts
        run: uv run lint-imports

  # The React app: types (generated from the API's schema, which the pytest job checks is
  # up to date), its tests, and a production build.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ci installs exactly what package-lock.json says, and fails if it's out of date.
      - name: Install dependencies
        run: npm ci
      - name: Types from the API schema are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Secrets and personal data: the same hooks as the local pre-commit check
  # (.pre-commit-config.yaml), plus a gitleaks scan of the whole history.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, for gitleaks-history
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      # The normal gitleaks hook only scans staged changes, so it's skipped here
      # and replaced by gitleaks-history, which scans every commit.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks
      - name: Gitleaks over full history
        run: uv run pre-commit run --hook-stage manual gitleaks-history
