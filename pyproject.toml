[project]
name = "cv-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "mcp[cli]>=2.2.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cv-server = "cv_server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
