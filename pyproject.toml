[project]
name = "cv-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "mcp[cli]>=2.2.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
cv-server = "cv_server:main"
job-agent = "job_agent:main"
job-score = "job_agent.scoring:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two packages under src/: the MCP server and the agent that uses it.
module-name = ["cv_server", "job_agent"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear (likely bugs),
# UP pyupgrade (modern syntax), SIM simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
