[project]
name = "cv-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.162.5",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp[cli]>=2.2.0",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
cv-server = "cv_server:main"
tracker-server = "tracker_server:main"
tracker-import = "tracker_server.importer:main"
job-agent = "job_assistant.experiments.agent:main"
job-score = "job_assistant.cli.score:main"
job-graph = "job_assistant.experiments.graph_agent:main"
job-pipeline = "job_assistant.cli.pipeline:main"
job-letter = "job_assistant.cli.letter:main"
job-verify-eval = "job_assistant.cli.checker_eval:main"
job-cv = "job_assistant.cli.cv:main"
job-apply = "job_assistant.cli.apply:main"
job-web = "job_assistant.cli.web:main"
job-posting = "job_assistant.cli.postings:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Packages under src/: two MCP servers, the application that uses them, and the posting
# file format they share. None imports another's internals (see [tool.importlinter]).
module-name = ["cv_server", "tracker_server", "job_postings", "job_assistant"]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear (likely bugs),
# UP pyupgrade (modern syntax), SIM simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

# Import rules, checked by `uv run lint-imports` (and in CI). Each package keeps to its
# own concerns: a contract fails the build if an import would break that.
[tool.importlinter]
root_packages = ["cv_server", "tracker_server", "job_postings", "job_assistant"]

[[tool.importlinter.contracts]]
name = "The MCP servers and the application are independent"
type = "independence"
modules = ["cv_server", "tracker_server", "job_assistant"]

[[tool.importlinter.contracts]]
name = "The posting format depends on nothing of ours"
type = "forbidden"
source_modules = ["job_postings"]
forbidden_modules = ["cv_server", "tracker_server", "job_assistant"]

# Each layer may import the layers below it, never above. Modules joined by | are
# side by side and may not import each other.
[[tool.importlinter.contracts]]
name = "job_assistant is layered"
type = "layers"
containers = ["job_assistant"]
layers = [
    "cli",
    "web",
    "workflow | evals",
    "drafting",
    "assessment",
    "llm | mcp | events | traces | console",
    "config",
]

[[tool.importlinter.contracts]]
name = "Nothing in the product imports the experiments"
type = "forbidden"
source_modules = [
    "job_assistant.cli", "job_assistant.web", "job_assistant.workflow", "job_assistant.evals",
    "job_assistant.drafting", "job_assistant.assessment",
    "job_assistant.llm", "job_assistant.mcp", "job_assistant.events", "job_assistant.traces",
    "job_assistant.console", "job_assistant.config",
]
forbidden_modules = ["job_assistant.experiments"]

[[tool.importlinter.contracts]]
name = "The experiments use only the core, not the product"
type = "forbidden"
source_modules = ["job_assistant.experiments"]
forbidden_modules = [
    "job_assistant.cli", "job_assistant.web", "job_assistant.workflow", "job_assistant.evals",
    "job_assistant.drafting", "job_assistant.assessment",
]
